name: Build macOS app (Intel)

# Builds the standalone Questboard.app on an Intel runner so it launches on
# Big Sur (macOS 11). Push a version tag to ship; or run manually from the
# Actions tab to produce a downloadable test build.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13          # Intel runner → x86_64 / Big Sur-compatible
    timeout-minutes: 30
    permissions:
      contents: write          # attach the zip to a GitHub Release
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Determine version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Questboard.app
        env:
          QUESTBOARD_VERSION: ${{ steps.ver.outputs.version }}
        run: pyinstaller --noconfirm --clean Questboard.spec

      - name: Zip the app
        working-directory: dist
        run: ditto -c -k --sequesterRsrc --keepParent Questboard.app Questboard-macOS-Intel.zip

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Questboard-macOS-Intel
          path: dist/Questboard-macOS-Intel.zip

      - name: Attach to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Questboard-macOS-Intel.zip
